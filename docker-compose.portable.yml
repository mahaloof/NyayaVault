# Standalone Windows/macOS/Linux demonstration; never references legacy volumes.
name: nyayavault-portable
x-peer-environment: &peer-environment
  FABRIC_CFG_PATH: /etc/hyperledger/fabric
  FABRIC_LOGGING_SPEC: INFO
  CORE_PEER_TLS_ENABLED: 'true'
  CORE_PEER_PROFILE_ENABLED: 'false'
  CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
  CORE_CHAINCODE_EXTERNALBUILDERS: '[{"name":"ccaas_builder","path":"/opt/hyperledger/ccaas_builder","propagateEnvironment":["CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG"]}]'
  CORE_CHAINCODE_EXECUTETIMEOUT: 30s
  CORE_LEDGER_STATE_STATEDATABASE: goleveldb
x-chaincode: &chaincode
  build: ./blockchain/chaincode
  image: nyayavault-chaincode:portable-1.0
  volumes: [fabric_crypto:/runtime:ro]
  restart: unless-stopped
  healthcheck:
    test: [CMD, node, -e, "const s=require('net').connect(9999,'127.0.0.1');s.on('connect',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));"]
    interval: 5s
    timeout: 3s
    retries: 30
services:
  fabric-bootstrap:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/fabric-portable/Dockerfile
    image: nyayavault-fabric-tools:2.5.16
    volumes: [fabric_crypto:/runtime]
  orderer:
    image: hyperledger/fabric-orderer:2.5.16
    environment:
      FABRIC_LOGGING_SPEC: INFO
      ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
      ORDERER_GENERAL_LISTENPORT: 7050
      ORDERER_GENERAL_LOCALMSPID: OrdererMSP
      ORDERER_GENERAL_LOCALMSPDIR: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/msp
      ORDERER_GENERAL_TLS_ENABLED: 'true'
      ORDERER_GENERAL_TLS_PRIVATEKEY: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      ORDERER_GENERAL_TLS_CERTIFICATE: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      ORDERER_GENERAL_TLS_ROOTCAS: '[/runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
      ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      ORDERER_GENERAL_CLUSTER_ROOTCAS: '[/runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
      ORDERER_GENERAL_BOOTSTRAPMETHOD: none
      ORDERER_CHANNELPARTICIPATION_ENABLED: 'true'
      ORDERER_ADMIN_LISTENADDRESS: 0.0.0.0:7053
      ORDERER_ADMIN_TLS_ENABLED: 'true'
      ORDERER_ADMIN_TLS_CERTIFICATE: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.crt
      ORDERER_ADMIN_TLS_PRIVATEKEY: /runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/server.key
      ORDERER_ADMIN_TLS_ROOTCAS: '[/runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
      ORDERER_ADMIN_TLS_CLIENTROOTCAS: '[/runtime/organizations/ordererOrganizations/example.com/orderers/orderer.example.com/tls/ca.crt]'
      ORDERER_OPERATIONS_LISTENADDRESS: 0.0.0.0:9443
      ORDERER_METRICS_PROVIDER: prometheus
    volumes:
      - fabric_crypto:/runtime:ro
      - fabric_orderer:/var/hyperledger/production/orderer
    networks:
      default: {aliases: [orderer.example.com]}
    restart: unless-stopped
  peer-org1:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.org1.example.com
      CORE_PEER_ADDRESS: peer0.org1.example.com:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.org1.example.com:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org1.example.com:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org1.example.com:7051
      CORE_PEER_LOCALMSPID: Org1MSP
      CORE_PEER_MSPCONFIGPATH: /runtime/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/msp
      CORE_PEER_TLS_CERT_FILE: /runtime/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /runtime/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /runtime/organizations/peerOrganizations/org1.example.com/peers/peer0.org1.example.com/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"chaincode-org1"}'
    command: peer node start
    volumes: [fabric_crypto:/runtime:ro, fabric_peer_org1:/var/hyperledger/production]
    networks:
      default: {aliases: [peer0.org1.example.com]}
    restart: unless-stopped
  peer-org2:
    image: hyperledger/fabric-peer:2.5.16
    environment:
      <<: *peer-environment
      CORE_PEER_ID: peer0.org2.example.com
      CORE_PEER_ADDRESS: peer0.org2.example.com:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.org2.example.com:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.org2.example.com:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.org2.example.com:9051
      CORE_PEER_LOCALMSPID: Org2MSP
      CORE_PEER_MSPCONFIGPATH: /runtime/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/msp
      CORE_PEER_TLS_CERT_FILE: /runtime/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/server.crt
      CORE_PEER_TLS_KEY_FILE: /runtime/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/server.key
      CORE_PEER_TLS_ROOTCERT_FILE: /runtime/organizations/peerOrganizations/org2.example.com/peers/peer0.org2.example.com/tls/ca.crt
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
      CHAINCODE_AS_A_SERVICE_BUILDER_CONFIG: '{"peername":"chaincode-org2"}'
    command: peer node start
    volumes: [fabric_crypto:/runtime:ro, fabric_peer_org2:/var/hyperledger/production]
    networks:
      default: {aliases: [peer0.org2.example.com]}
    restart: unless-stopped
  chaincode-org1: *chaincode
  chaincode-org2: *chaincode
  fabric-gateway:
    build: ./blockchain/gateway
    image: nyayavault-gateway:portable-1.0
    environment:
      GATEWAY_HOST: 0.0.0.0
      FABRIC_PEER_ENDPOINT: peer0.org1.example.com:7051
      FABRIC_PEER_HOST: peer0.org1.example.com
      FABRIC_MSP_ID: Org1MSP
      FABRIC_CHANNEL: nyayachannel
      FABRIC_CHAINCODE: nyayavault
      FABRIC_TLS_CERT: /runtime/gateway-identity/tls.crt
      FABRIC_CERT: /runtime/gateway-identity/cert.pem
      FABRIC_KEY: /runtime/gateway-identity/key.pem
      FABRIC_GATEWAY_SECRET: ${FABRIC_GATEWAY_SECRET:?Set FABRIC_GATEWAY_SECRET in .env.portable}
    volumes: [fabric_crypto:/runtime:ro]
    depends_on:
      chaincode-org1: {condition: service_healthy}
      chaincode-org2: {condition: service_healthy}
      peer-org1: {condition: service_started}
      peer-org2: {condition: service_started}
    restart: unless-stopped
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nyayavault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.portable}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vault -d nyayavault]
      interval: 5s
      retries: 30
    restart: unless-stopped
  minio:
    build: ./docker/minio
    image: nyayavault-minio:source-7aac2a2
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY in .env.portable}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env.portable}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001']
    restart: unless-stopped
  backend:
    build: ./backend
    image: nyayavault-backend:portable-1.0
    environment:
      DATABASE_URL: postgresql+psycopg://vault:${POSTGRES_PASSWORD}@postgres:5432/nyayavault
      AI_PROVIDER: ${AI_PROVIDER:-disabled}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gemini-3.5-flash-lite}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.portable}
      EVIDENCE_MASTER_KEY: ${EVIDENCE_MASTER_KEY:?Set EVIDENCE_MASTER_KEY in .env.portable}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: evidence
      BLOCKCHAIN_PROVIDER: fabric
      FABRIC_GATEWAY_URL: http://fabric-gateway:4000
      FABRIC_GATEWAY_SECRET: ${FABRIC_GATEWAY_SECRET}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3001},http://127.0.0.1:${FRONTEND_PORT:-3001}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
      fabric-gateway: {condition: service_started}
    ports: ['127.0.0.1:${BACKEND_PORT:-8001}:8000']
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${BACKEND_PORT:-8001}/api
    image: nyayavault-frontend:portable-1.0
    depends_on: [backend]
    ports: ['127.0.0.1:${FRONTEND_PORT:-3001}:3000']
    restart: unless-stopped
  tools:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/portable-tools/Dockerfile
    image: nyayavault-portable-tools:1.0
    volumes: [.:/project]
  demo:
    profiles: [tools]
    build:
      context: .
      dockerfile: docker/portable-tools/Dockerfile
    image: nyayavault-portable-tools:1.0
    command: [python, /opt/nyayavault/config.py, demo, --api, http://backend:8000/api]
    volumes:
      - portable_tools_data:/workspace/blockchain/runtime
      - portable_reports:/workspace/docs
volumes:
  postgres_data:
  minio_data:
  fabric_crypto:
  fabric_orderer:
  fabric_peer_org1:
  fabric_peer_org2:
  portable_tools_data:
  portable_reports:
