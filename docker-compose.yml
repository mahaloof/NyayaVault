name: nyayavault
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nyayavault
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vault -d nyayavault]
      interval: 5s
      retries: 20
  minio:
    build: ./docker/minio
    image: nyayavault-minio:source-7aac2a2
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Set MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ['127.0.0.1:9001:9001']
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vault:${POSTGRES_PASSWORD}@postgres:5432/nyayavault
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      EVIDENCE_MASTER_KEY: ${EVIDENCE_MASTER_KEY:?Set EVIDENCE_MASTER_KEY}
      STORAGE_PROVIDER: minio
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: evidence
      BLOCKCHAIN_PROVIDER: development
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000},http://127.0.0.1:${FRONTEND_PORT:-3000}
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_started}
    ports: ['127.0.0.1:${BACKEND_PORT:-8000}:8000']
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://127.0.0.1:${BACKEND_PORT:-8000}/api
    depends_on: [backend]
    ports: ['127.0.0.1:${FRONTEND_PORT:-3000}:3000']
volumes:
  postgres_data:
  minio_data:
